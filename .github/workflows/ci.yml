name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }} (${{ matrix.config }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            config: windows-mingw
            preset: windows
          - os: ubuntu-latest
            config: linux-gcc
            preset: linux
          - os: macos-latest
            config: macos-clang
            preset: macos

    steps:
      - uses: actions/checkout@v4

      # CMakeLists.txt is the single source of truth for the version. Fail fast
      # on a tag that disagrees with it, instead of publishing installers whose
      # filenames (driven by project(VERSION)) do not match the release tag.
      - name: Verify tag matches CMake version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          CMAKE_VER="$(sed -n 's/^project(.*VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt | head -n1)"
          echo "tag: $TAG   CMakeLists VERSION: $CMAKE_VER"
          if [ -z "$CMAKE_VER" ]; then
            echo "::error::Could not parse project(... VERSION ...) from CMakeLists.txt"
            exit 1
          fi
          if [ "$TAG" != "v${CMAKE_VER}" ]; then
            echo "::error::Tag '$TAG' does not match project(VERSION $CMAKE_VER). Bump CMakeLists.txt and commit before tagging."
            exit 1
          fi
          echo "Version tag matches CMakeLists.txt"

      # --- Windows: MSYS2 MinGW (fully open-source) ---------------------------
      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-poppler-qt6
            mingw-w64-x86_64-nsis
            mingw-w64-x86_64-pkgconf

      # --- Qt / Poppler (Linux / macOS) --------------------------------------
      - name: Install Qt 6 (Linux)
        if: runner.os == 'Linux'
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.2"
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Install Qt 6 (macOS)
        if: runner.os == 'macOS'
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.2"
          host: mac
          target: desktop
          arch: clang_64
          cache: true

      - name: Install Poppler (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpoppler-qt6-dev pkg-config

      # Qt 6's macOS CMake still lists the legacy AGL framework in its interface
      # link libraries, but AGL was removed from modern macOS SDKs, so ld fails
      # with "framework 'AGL' not found". Qt 6 does not actually use AGL (it is on
      # Metal/OpenGL), so an empty stub framework is enough to satisfy the linker.
      - name: Create AGL stub framework (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          AGL_DIR="$RUNNER_TEMP/agl-stub"
          mkdir -p "$AGL_DIR/AGL.framework"
          printf 'void pdf_to_plain_text_agl_stub(void) {}\n' > "$RUNNER_TEMP/agl_stub.c"
          clang -arch arm64 -dynamiclib \
                -install_name @rpath/AGL.framework/AGL \
                -o "$AGL_DIR/AGL.framework/AGL" "$RUNNER_TEMP/agl_stub.c"
          echo "AGL_STUB=$AGL_DIR" >> $GITHUB_ENV
          ls -l "$AGL_DIR/AGL.framework/"

      # NOTE: Homebrew's poppler formula hardcodes -DENABLE_QT6=OFF, so it can
      # never provide poppler-qt6. We build poppler from source against the
      # Qt 6 installed by install-qt-action above.
      - name: Build Poppler with Qt6 (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          # Poppler's own hard dependencies. 'brew install poppler' is NOT used
          # because that formula hardcodes -DENABLE_QT6=OFF.
          brew install cairo fontconfig freetype harfbuzz jpeg-turbo libpng \
                       libtiff little-cms2 nspr nss openjpeg libiconv \
                       zlib gettext gperf ninja pkgconf clang-format
          POPPLER_VERSION=26.04.0
          POPPLER_PREFIX="$RUNNER_TEMP/poppler"
          curl -fsSL "https://poppler.freedesktop.org/poppler-${POPPLER_VERSION}.tar.xz" -o poppler.tar.xz
          tar xf poppler.tar.xz
          cmake -S "poppler-${POPPLER_VERSION}" -B poppler-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$POPPLER_PREFIX" \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR;/opt/homebrew" \
            -DCMAKE_FRAMEWORK_PATH="$AGL_STUB" \
            -DCMAKE_SHARED_LINKER_FLAGS="-F$AGL_STUB" \
            -DCMAKE_CXX_FLAGS="-F$AGL_STUB" \
            -DENABLE_QT6=ON \
            -DENABLE_QT5=OFF \
            -DENABLE_GLIB=OFF \
            -DENABLE_BOOST=OFF \
            -DENABLE_GPGME=OFF \
            -DENABLE_UNSTABLE_API_ABI_HEADERS=ON \
            -DBUILD_GTK_TESTS=OFF \
            -DBUILD_QT5_TESTS=OFF \
            -DBUILD_QT6_TESTS=OFF \
            -DBUILD_CPP_TESTS=OFF \
            -DBUILD_MANUAL_TESTS=OFF
          cmake --build poppler-build --parallel
          cmake --install poppler-build
          echo "PKG_CONFIG_PATH=$POPPLER_PREFIX/lib/pkgconfig" >> $GITHUB_ENV
          echo "POPPLER_PREFIX=$POPPLER_PREFIX" >> $GITHUB_ENV
          echo "poppler-qt6 version: $(pkg-config --modversion poppler-qt6)"

      # --- CMake configure / build --------------------------------------------
      - name: Configure (Windows MinGW via MSYS2)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$POPPLER_PREFIX" \
            -DCMAKE_FRAMEWORK_PATH="$AGL_STUB" \
            -DCMAKE_EXE_LINKER_FLAGS="-F$AGL_STUB" \
            -DCMAKE_SHARED_LINKER_FLAGS="-F$AGL_STUB" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cmake --build build --parallel

      - name: Build (Linux / macOS)
        if: runner.os != 'Windows'
        run: cmake --build build --parallel

      # macOS: ship poppler dylibs inside the .app and make them self-relative
      - name: Bundle Poppler dylibs (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          APP="build/PDFToPlainText.app"
          FRAMEWORKS="$APP/Contents/Frameworks"
          mkdir -p "$FRAMEWORKS"
          # Poppler Qt6 stack
          for lib in libpoppler-qt6 libpoppler; do
            src=$(ls "$POPPLER_PREFIX/lib"/${lib}*.dylib 2>/dev/null | head -1 || true)
            if [ -n "$src" ]; then
              base=$(basename "$src")
              cp "$src" "$FRAMEWORKS/$base"
              # Rewrite the dylib's own id and its sibling deps to @loader_path
              install_name_tool -id "@rpath/$base" "$FRAMEWORKS/$base" 2>/dev/null || true
            fi
          done
          # Point the app binary at the bundled dylibs
          BIN="$APP/Contents/MacOS/PDFToPlainText"
          for lib in libpoppler-qt6 libpoppler; do
            base=$(ls "$FRAMEWORKS"/${lib}*.dylib 2>/dev/null | head -1 | xargs -r basename || true)
            if [ -n "$base" ]; then
              install_name_tool -change "$POPPLER_PREFIX/lib/$base" "@rpath/$base" "$BIN" 2>/dev/null || true
              install_name_tool -change "$POPPLER_PREFIX/lib/$base" "@loader_path/$base" "$FRAMEWORKS/$base" 2>/dev/null || true
            fi
          done
          # Never ship the AGL linker stub
          rm -rf "$FRAMEWORKS/AGL.framework" "$AGL_STUB"
          otool -L "$BIN" | head -20
          if otool -L "$BIN" | grep -q "AGL.framework"; then
            echo "::warning::AGL.framework still referenced by the app binary"
          fi
        shell: bash

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        working-directory: build
        run: cpack --config CPackConfig.cmake -B "${GITHUB_WORKSPACE}/packages"

      - name: Package (Linux / macOS)
        if: runner.os != 'Windows'
        working-directory: build
        run: cpack --config CPackConfig.cmake -B "${{ github.workspace }}/packages"
        shell: bash

      # CPack leaves a _CPack_Packages staging tree (the full uncompressed
      # install tree - 150MB/79 files on Windows, far more on macOS where it
      # holds the whole .app with every Qt framework). Uploading it alongside
      # the real installers is what exhausted the Node heap in
      # actions/upload-artifact, so delete it before packaging steps.
      - name: Drop CPack staging tree
        run: |
          rm -rf packages/_CPack_Packages
          du -sh packages 2>/dev/null || true
        shell: bash

      # Boot-test the exact macOS package users download: unpack it, verify
      # every dylib reference inside the bundle is self-contained, then launch
      # the app headless (QT_QPA_PLATFORM=offscreen — runners have no display)
      # and assert it stays up. Catches missing Qt platform plugins, unbundled
      # poppler dylibs, and absolute RUNNER_TEMP/brew paths leaking into the
      # shipped bundle (which would break on any machine but the runner's).
      #
      # NOTE: we test the Darwin .zip, not the .dmg. CPack embeds LICENSE as
      # a DMG license agreement (SLA), so `hdiutil attach` demands interactive
      # agreement and aborts with "attach canceled" on headless CI. The .zip
      # holds the identical .app with no such gate; the license-on-mount
      # behavior of the .dmg is a feature for end users, not something to
      # strip for CI's convenience.
      - name: Smoke-test macOS package
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          ZIP=$(ls packages/*-Darwin.zip | head -1)
          echo "Testing $ZIP"
          rm -rf /tmp/pdfunzip /tmp/PDFSmoke.app
          mkdir -p /tmp/pdfunzip
          unzip -q "$ZIP" -d /tmp/pdfunzip
          APP_SRC=$(find /tmp/pdfunzip -maxdepth 3 -name "*.app" | head -1)
          if [ -z "$APP_SRC" ]; then
            echo "::error::No .app found inside $ZIP"
            exit 1
          fi
          cp -R "$APP_SRC" /tmp/PDFSmoke.app
          # Strip any quarantine flag so Gatekeeper can never hang the launch
          # on an invisible prompt. Locally built files normally carry none,
          # but this keeps the test immune if the artifact ever arrives via
          # a quarantining path (e.g. testing a downloaded release asset).
          xattr -rd com.apple.quarantine /tmp/PDFSmoke.app 2>/dev/null || true
          BIN="/tmp/PDFSmoke.app/Contents/MacOS/PDFToPlainText"
          echo "--- linked libraries ---"
          otool -L "$BIN"
          echo "--- checking for non-relocatable references ---"
          # Every non-system reference must be @rpath/@loader_path/@executable_path.
          # Absolute paths (runner temp dir, /opt/homebrew, removed AGL stub,
          # ...) work on the runner but break on user machines.
          LEAKS=$(otool -L "$BIN" /tmp/PDFSmoke.app/Contents/Frameworks/*.dylib 2>/dev/null | grep -E "^[[:space:]]+/" | grep -vE "^[[:space:]]+/(usr/lib/|System/)" || true)
          if [ -n "$LEAKS" ]; then
            echo "::error::Non-relocatable dylib references in the shipped bundle:"
            echo "$LEAKS"
            exit 1
          fi
          echo "--- launching headless ---"
          QT_QPA_PLATFORM=offscreen "$BIN" > /tmp/smoke.log 2>&1 &
          PID=$!
          sleep 10
          if ! kill -0 $PID 2>/dev/null; then
            echo "::error::App exited within 10s. Log:"
            cat /tmp/smoke.log
            exit 1
          fi
          kill $PID 2>/dev/null || true
          wait $PID 2>/dev/null || true
          echo "--- app log ---"
          cat /tmp/smoke.log
          if grep -Ei "library not loaded|could not (find or load|load the Qt platform)|not found" /tmp/smoke.log; then
            echo "::error::Loader errors in app log (see above)"
            exit 1
          fi
          echo "Smoke test passed: app launched and stayed alive"
        shell: bash

      # On failure, collect the system's own crash reports (.ips) — they
      # contain the termination reason and the crashed thread's backtrace,
      # which the app's stdout log alone does not. Runs only on failure;
      # warns instead of failing when there is nothing to upload (e.g. the
      # otool check failed before anything launched).
      - name: Upload macOS crash logs
        if: failure() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-crash-reports
          path: ~/Library/Logs/DiagnosticReports/
          if-no-files-found: warn
          retention-days: 7

      - name: List packages
        run: ls -lh packages
        shell: bash

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        env:
          # upload-artifact buffers files in memory; give it headroom
          NODE_OPTIONS: --max-old-space-size=8192
        with:
          name: packages-${{ matrix.config }}
          # Only real installers, never staging directories
          path: |
            packages/*.exe
            packages/*.dmg
            packages/*.zip
            packages/*.tar.gz
            packages/*.deb
          if-no-files-found: error
          compression-level: 0

  # --- Release: single job, runs only when every platform built successfully
  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: packages-*
          merge-multiple: true

      - name: List downloaded installers
        run: ls -lh dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.tar.gz
            dist/*.deb
          fail_on_unmatched_files: true
          generate_release_notes: true
