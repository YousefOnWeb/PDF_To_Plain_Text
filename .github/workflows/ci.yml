name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }} (${{ matrix.config }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            config: windows-mingw
            preset: windows
          - os: ubuntu-latest
            config: linux-gcc
            preset: linux
          - os: macos-latest
            config: macos-clang
            preset: macos

    steps:
      - uses: actions/checkout@v4

      # --- Windows: MSYS2 MinGW (fully open-source) ---------------------------
      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-poppler-qt6
            mingw-w64-x86_64-pkgconf

      # --- Qt / Poppler (Linux / macOS) --------------------------------------
      - name: Install Qt 6 (Linux)
        if: runner.os == 'Linux'
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.2"
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Install Qt 6 (macOS)
        if: runner.os == 'macOS'
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.2"
          host: mac
          target: desktop
          arch: clang_64
          cache: true

      - name: Install Poppler (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpoppler-qt6-dev pkg-config

      - name: Install Poppler (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install poppler pkg-config

      # --- CMake configure / build --------------------------------------------
      - name: Configure (Windows MinGW via MSYS2)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cmake --build build --parallel

      - name: Build (Linux / macOS)
        if: runner.os != 'Windows'
        run: cmake --build build --parallel

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        working-directory: build
        run: cpack --config CPackConfig.cmake -B "${GITHUB_WORKSPACE}/packages"

      - name: Package (Linux / macOS)
        if: runner.os != 'Windows'
        working-directory: build
        run: cpack --config CPackConfig.cmake -B "${{ github.workspace }}/packages"
        shell: bash

      - name: List packages
        run: ls -R packages || dir packages
        shell: bash

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.config }}
          path: packages/*
          if-no-files-found: error

      # --- Release on tag -----------------------------------------------------
      - name: Release (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          generate_release_notes: true
